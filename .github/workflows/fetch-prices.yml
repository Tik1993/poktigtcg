name: Fetch prices

on:
  schedule:
    - cron: "0 10 * * *" 
  workflow_dispatch: 

jobs:
  fetch-prices:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
    
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
            node-version: 22
    
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
    
      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements.txt
          
      - name: Export card URLs from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute poktig --remote --command "SELECT card_id, pricecharting_url FROM cards" --json | jq 'if type == "array" then .[0].results else .results end' > fetch_price/urls.json
    
      - name: Fetch prices
        run: python3 fetch_price/fetch_prices.py
      
      - name: Write prices to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute poktig --remote --file fetch_price/prices.sql

